[server]
headless = true
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"
enableStaticServing = true      # dashboard/static: the Inter font file

[browser]
gatherUsageStats = false

# Light and dark themes: the app follows the device (day/night) and the user can
# switch in ⋮ → Settings. Tables and editors are recoloured together with the page.
# «Бумага» (light): warm page, white cards and inputs. «Графит» (dark): page, card and
# raised layers instead of frames. secondaryBackgroundColor is the card layer in both.
[theme]
primaryColor = "#4F46E5"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
baseRadius = "0.5rem"
showWidgetBorder = true

# One font for everything, served by the app itself (no third-party font host).
[[theme.fontFaces]]
family = "Inter"
url = "app/static/InterVariable.woff2"
weight = "100 900"
style = "normal"

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
borderColor = "#E4E2DB"
dataframeHeaderBackgroundColor = "#F3F2EE"

[theme.light.sidebar]
backgroundColor = "#EFEDE7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"

[theme.dark]
primaryColor = "#6366F1"
backgroundColor = "#0C0F16"
secondaryBackgroundColor = "#161B26"
textColor = "#E6EAF2"
borderColor = "#262D3D"
dataframeHeaderBackgroundColor = "#1B2130"

[theme.dark.sidebar]
backgroundColor = "#090C12"
secondaryBackgroundColor = "#161B26"
textColor = "#E6EAF2"
